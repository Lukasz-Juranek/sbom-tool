name: Tests
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
env:
  # GitHub runners export ANDROID_HOME/ANDROID_SDK_ROOT, and more-disk-space
  # strips the SDK's contents to free space while leaving those variables set.
  # rules_android (pulled in transitively) then auto-detects the now-empty SDK
  # and fails analysis with "No Android SDK apis found". Blanking the variables
  # makes it skip auto-configuration. Same guard as eclipse-score/tooling.
  ANDROID_HOME: ""
  ANDROID_SDK_ROOT: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
# Do not flood CI with superseded runs on a PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit_tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
      - name: Free disk space
        uses: eclipse-score/more-disk-space@v1
        with:
          level: 4
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: unit_tests
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}
      - name: Run unit tests
        run: bazel test --test_output=errors //tests/...
